<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assessment Gym</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Free, no-sign-up practice for all 13 HireVue-style assessment games: timed play, adaptive levels, results, a mock assessment and a 7-day prep plan.">
<meta name="theme-color" content="#0b7a61">
<meta property="og:title" content="Assessment Gym: practise HireVue-style games">
<meta property="og:description" content="Timed practice for 13 game-based assessment formats, with feedback and progress tracking. Free, no sign-up.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b7a61'/%3E%3Cpath d='M9 21l5-10 4 7 2-3 3 6' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: a training-floor app. Sticky top bar, hub of game cards, focused full-width play stage with a draining time bar. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --sunk:#e8eeec; --ink:#13201c; --muted:#56675f; --line:#d5dfdb;
  --accent:#0b7a61; --accent-soft:#d5efe7; --accent-ink:#ffffff; --signal:#e39a12;
  --ok:#1d9a55; --bad:#d23f3f; --slow:#b9770b;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1513; --surface:#15201d; --sunk:#1c2925; --ink:#e4eeea; --muted:#93a69f; --line:#2a3a36;
  --accent:#3fc9a4; --accent-soft:#173a31; --accent-ink:#04201a; --signal:#f2b53c;
  --ok:#3cc47a; --bad:#f06a6a; --slow:#e0a43a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1513; --surface:#15201d; --sunk:#1c2925; --ink:#e4eeea; --muted:#93a69f; --line:#2a3a36;
  --accent:#3fc9a4; --accent-soft:#173a31; --accent-ink:#04201a; --signal:#f2b53c;
  --ok:#3cc47a; --bad:#f06a6a; --slow:#e0a43a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5vw,3.1rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.6rem;font-weight:700;letter-spacing:-.01em}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:58px;flex-wrap:wrap;padding-block:6px}
.brand{display:flex;align-items:center;gap:9px;font:800 1.15rem var(--f-display);color:var(--ink);text-decoration:none}
.brand svg{width:26px;height:26px}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.nav a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;font-weight:500}
.nav a:hover,.nav a.on{color:var(--ink);background:var(--sunk)}
main{padding-block:28px 60px}
section{margin-top:56px}
.eyebrow{font:600 .75rem var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.lede{color:var(--muted);max-width:62ch;font-size:1.05rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;background:var(--accent);color:var(--accent-ink);font:600 .95rem var(--f-body);padding:10px 18px;border-radius:10px;cursor:pointer;text-decoration:none;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:6px 12px;font-size:.85rem}
.btn.yes{background:var(--ok);color:#fff}
.btn.no{background:var(--bad);color:#fff}
.btn:focus-visible,a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
kbd{font:500 .75rem var(--f-mono);background:rgba(0,0,0,.18);padding:1px 6px;border-radius:5px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 .75rem var(--f-body);padding:3px 10px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.cat-Cognitive{--cat:#2f74d0}.cat-Spatial{--cat:#c4630f}.cat-Personality{--cat:#a03fb3}
.catdot{width:8px;height:8px;border-radius:50%;background:var(--cat)}

/* hero */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:36px;align-items:center}
.hero > *{min-width:0}
.hero .row{margin-top:22px}
.hero-demo{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 18px 40px -24px rgba(10,40,30,.35)}
.demo-bar{display:flex;align-items:center;gap:8px;font:600 .8rem var(--f-body);color:var(--muted)}
.demo-bar .mono{margin-left:auto;color:var(--ink)}
.demo-stage{display:grid;place-items:center;gap:14px;padding:22px 0 8px}
.demo-stage .stim-card{width:130px;height:130px}
.statline{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:30px}
.statline div{background:var(--surface);padding:14px 16px}
.statline b{display:block;font:700 1.5rem var(--f-display)}
.statline span{color:var(--muted);font-size:.85rem}

/* cards */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.filters button{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:99px;font:500 .9rem var(--f-body);cursor:pointer}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card p{color:var(--muted);font-size:.9rem;flex:1}
.card .foot{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted)}
.card .foot b{color:var(--accent);font-weight:600}
.card .best{font:500 .78rem var(--f-mono);color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:600 .72rem var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.act a{margin-right:10px;font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.grid2 > *,.grid3 > *{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel h3{margin-bottom:8px}
.panel p{color:var(--muted)}
details{border-bottom:1px solid var(--line);padding:14px 0}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
details summary::after{content:"+";font:600 1.2rem var(--f-mono);color:var(--accent)}
details[open] summary::after{content:"–"}
details p{margin-top:10px;color:var(--muted);max-width:70ch}
.steps{display:grid;gap:12px;counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s,decimal-leading-zero);font:700 .9rem var(--f-mono);color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:6px 0;text-align:center}
.crumbs{font-size:.85rem;color:var(--muted);margin-bottom:14px}
.crumbs a{color:var(--muted)}
.detail-hero{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:start}
.detail-hero > *{min-width:0}
.skills{display:flex;gap:8px;flex-wrap:wrap}
.disclaim{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;color:var(--muted);text-align:center}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:500 11px var(--f-body)}
.chart .lbl{fill:var(--ink);font:700 12px var(--f-mono)}
.chart .grid{stroke:var(--line)}
.chart .bar{fill:var(--accent)}
.chart .bar.base{fill:var(--sunk);stroke:var(--line)}
.chart .line{stroke:var(--accent);fill:none;stroke-width:2.5}
.chart .area{fill:var(--accent-soft)}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}

/* play */
.play{max-width:880px;margin:0 auto}
.playbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;padding:10px 14px}
.playbar strong{font:700 1.05rem var(--f-display)}
.playbar .sp{flex:1}
.timer{font:700 1.1rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.timer.low{color:var(--bad)}
.timebar{height:5px;background:var(--sunk);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.timebar i{display:block;height:100%;background:var(--accent);width:100%;transition:width .2s linear}
.stagewrap{position:relative;background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);padding:26px 18px 18px;min-height:440px}
.stage{display:flex;flex-direction:column;align-items:center;gap:18px}
.hint{text-align:center;color:var(--muted);font-size:.8rem;margin-top:16px}
.fb{position:absolute;top:12px;left:50%;transform:translateX(-50%);font:700 .9rem var(--f-body);padding:5px 14px;border-radius:99px;opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap}
.fb.show{opacity:1}
.fb.ok{background:var(--ok);color:#fff}.fb.bad{background:var(--bad);color:#fff}.fb.slow{background:var(--slow);color:#fff}.fb.info{background:var(--ink);color:var(--bg)}
.prompt{font:600 1.05rem var(--f-body);background:var(--sunk);padding:8px 16px;border-radius:99px;text-align:center}
.stim-card{width:190px;height:190px;max-width:100%;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px -18px rgba(0,0,0,.4);display:grid;place-items:center}
.stim-card.blank{background:var(--sunk);box-shadow:none}
.inter{display:grid;gap:4px;text-align:center}
.inter b{font:800 1.3rem var(--f-display);color:var(--accent)}
.inter span{color:var(--muted);font-size:.85rem}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btnrow .btn{min-width:150px;padding:12px 20px}

/* numerosity */
.tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:560px}
.tile{width:68px;height:68px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 1.35rem var(--f-mono);cursor:pointer;transition:transform .08s}
.tile:hover{border-color:var(--accent)}
.tile.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);transform:scale(1.06)}
.calc{font:500 1rem var(--f-mono);color:var(--muted);min-height:1.5em}

/* pathfinder */
.pf{display:grid;gap:3px}
.pf .cell{width:var(--cs);height:var(--cs);background:var(--sunk);border-radius:6px;display:grid;place-items:center;cursor:pointer;border:2px solid transparent}
.pf .cell.locked{background:var(--line);cursor:default}
.pf .cell.empty:hover{border-color:var(--accent)}
.pf .mark{width:var(--cs);height:var(--cs);display:grid;place-items:center;font:700 .7rem var(--f-mono);color:var(--accent)}
.pf svg,.tray svg{width:100%;height:100%}
.pipe{stroke:var(--ink);stroke-width:22;fill:none}
.pipe-c{fill:var(--ink)}
.locked .pipe{stroke:var(--muted)}.locked .pipe-c{fill:var(--muted)}
.solved .pipe{stroke:var(--ok)}.solved .pipe-c{fill:var(--ok)}
.tray{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:560px}
.tray button{width:54px;height:54px;padding:6px;border-radius:8px;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.tray button.sel{border-color:var(--signal);background:var(--accent-soft)}

/* digitspan */
.bigchar{font:800 5rem var(--f-mono);height:150px;display:grid;place-items:center}
.slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:52px}
.slots span{width:40px;height:50px;border-bottom:3px solid var(--line);display:grid;place-items:center;font:700 1.6rem var(--f-mono)}
.slots span.f{border-color:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(6,56px);gap:8px;justify-content:center}
.keypad button{height:48px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 1.1rem var(--f-mono);cursor:pointer}
.keypad button:hover{background:var(--sunk)}

/* disconumbers */
.disc{display:grid;gap:14px}
.disc button{width:76px;height:76px;border-radius:50%;border:3px solid var(--line);background:var(--sunk);color:var(--ink);font:700 1.5rem var(--f-mono);cursor:pointer;transition:background .12s,transform .12s}
.disc button.lit{background:var(--signal);border-color:var(--signal);color:#1a1200;transform:scale(1.08)}
.disc button.picked{border-color:var(--accent);background:var(--accent-soft)}
.disc button:disabled{cursor:default}

/* puzzle */
.pz{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.pzboard{display:grid;gap:2px;background:var(--line);padding:2px;border-radius:8px}
.pzboard div,.pztray button{width:var(--ps);height:var(--ps);background-repeat:no-repeat;border:0;padding:0}
.pzboard div{background-color:var(--sunk);cursor:pointer}
.pztray{display:flex;flex-wrap:wrap;gap:6px;max-width:330px}
.pztray button{cursor:pointer;border-radius:4px;outline-offset:1px}
.pztray button.sel{outline:3px solid var(--signal)}
.pzimg{width:min(300px,80vw);aspect-ratio:1;border-radius:10px;background-size:cover;max-width:100%}

/* shapedance & singularity */
.target{display:flex;align-items:center;gap:12px;background:var(--sunk);padding:8px 16px;border-radius:12px}
.sgrid{display:grid;gap:10px}
.sgrid button{width:var(--gs);height:var(--gs);border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;padding:8px;display:grid;place-items:center}
.sgrid button:hover{border-color:var(--accent)}
.sgrid button.sel{border-color:var(--accent);background:var(--accent-soft)}
.sgrid button.right{border-color:var(--ok)}.sgrid button.wrong{border-color:var(--bad)}
.sgrid svg{width:100%;height:100%;overflow:visible}
.glyph rect{fill:var(--ink)}

/* personality */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:620px}
.pair button{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:18px 14px;cursor:pointer;color:var(--ink);display:grid;gap:12px;justify-items:center;font:500 .95rem var(--f-body);text-align:center}
.pair button:hover{border-color:var(--accent);background:var(--accent-soft)}
.pair svg{width:86px;height:86px;stroke:var(--accent);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.statement{font:600 1.3rem var(--f-display);text-align:center;max-width:30ch;min-height:3.2em;display:grid;place-items:center}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:640px}
.likert button{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 4px;cursor:pointer;font:500 .8rem var(--f-body);display:grid;gap:4px}
.likert button b{font:700 1rem var(--f-mono);color:var(--accent)}
.likert button:hover{border-color:var(--accent)}
.prog{width:100%;max-width:620px;height:4px;background:var(--sunk);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.face{width:220px;max-width:70vw}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%;max-width:420px}
.opts.six{grid-template-columns:repeat(3,1fr);max-width:520px}
.opts button{padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:600 .95rem var(--f-body);cursor:pointer}
.opts button:hover{border-color:var(--accent)}
.opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.opts button.wrong{border-color:var(--bad)}
.chat{width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px;max-height:330px;overflow-y:auto;padding:4px}
.msg{max-width:82%;padding:9px 13px;border-radius:14px;font-size:.93rem}
.msg small{display:block;font-weight:600;font-size:.72rem;color:var(--muted);margin-bottom:2px}
.msg.them{background:var(--sunk);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:4px}
.msg.sys{align-self:center;background:none;color:var(--muted);font-size:.8rem;text-align:center}
.replies{display:grid;gap:8px;width:100%;max-width:560px}
.replies button{text-align:left;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:500 .92rem var(--f-body);cursor:pointer}
.replies button:hover{border-color:var(--accent)}
.typing{color:var(--muted);font-size:.8rem;font-style:italic;min-height:1.2em;align-self:flex-start}
.arena{position:relative;width:100%;max-width:640px;height:340px;background:var(--sunk);border-radius:14px;cursor:crosshair;touch-action:manipulation;user-select:none}
.dot{position:absolute;width:56px;height:56px;border-radius:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;transition:transform .12s,opacity .12s}
.dot.on{transform:translate(-50%,-50%) scale(1);opacity:1}

/* results */
.result{max-width:880px;margin:0 auto;display:grid;gap:22px}
.score-hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
.score-hero .big{font:800 4rem/1 var(--f-display);color:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kv div{background:var(--surface);padding:12px 14px}
.kv span{display:block;color:var(--muted);font-size:.78rem}
.kv b{font:700 1.15rem var(--f-mono)}
.bars{display:grid;gap:12px}
.bar2{display:grid;grid-template-columns:110px 1fr 110px;gap:10px;align-items:center;font-size:.85rem}
.bar2 .r{text-align:right}
.bar2 .t{height:10px;background:var(--sunk);border-radius:6px;position:relative}
.bar2 .t i{position:absolute;top:-3px;width:16px;height:16px;border-radius:50%;background:var(--accent);transform:translateX(-50%);border:3px solid var(--surface)}
.bar2 .t::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.bar1{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;font-size:.88rem}
.bar1 .t{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar1 .t i{display:block;height:100%;background:var(--accent)}

/* interview */
.q-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px;display:grid;gap:16px}
.q-text{font:700 1.5rem var(--f-display)}
.ring{font:800 2.6rem var(--f-mono)}
textarea,select,input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:120px;resize:vertical}
label.chk{display:flex;gap:10px;align-items:center;padding:6px 0}
.confirm{background:var(--accent-soft);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* additions: countdown, guides, review, plan, interview camera */
.playname{font:700 1.05rem var(--f-display);margin:0}
.h2{font-size:1.6rem}.h3{font-size:1.1rem}
.countdown{display:grid;place-items:center;gap:12px;min-height:300px;text-align:center}
.countdown span{font:800 5.5rem/1 var(--f-display);color:var(--accent)}
.countdown small{color:var(--muted);max-width:44ch;font-size:.95rem}
.list{margin:12px 0 0;padding-left:20px;display:grid;gap:8px}
.list.warn li::marker{color:var(--bad)}
.review{display:grid;gap:10px;margin-top:12px;max-height:520px;overflow-y:auto}
.rv{border-left:4px solid var(--line);padding:8px 12px;background:var(--sunk);border-radius:0 8px 8px 0;display:grid;gap:4px}
.rv.good{border-color:var(--ok)}.rv.ok{border-color:var(--signal)}.rv.weak{border-color:var(--bad)}
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:20px}
.cam{width:100%;max-width:480px;aspect-ratio:4/3;background:#000;border-radius:12px;object-fit:cover}
.recdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:6px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.skip{position:absolute;left:-999px;top:8px;background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:8px;z-index:20}
.skip:focus{left:max(16px,env(safe-area-inset-left,0px))}
h1[tabindex="-1"]:focus{outline:none}
label{display:grid;gap:4px;font-weight:500}
label.chk{display:flex;font-weight:400}

@media (max-width:820px){
  .hero,.detail-hero,.grid2{grid-template-columns:1fr}
  .grid3{grid-template-columns:1fr}
  .statline{grid-template-columns:repeat(2,1fr)}
  .score-hero{grid-template-columns:1fr}
}
@media (max-width:480px){
  .tile{width:56px;height:56px;font-size:1.1rem}
  .keypad{grid-template-columns:repeat(5,52px)}
  .disc button{width:62px;height:62px}
  .pair{grid-template-columns:1fr}
  .opts.six{grid-template-columns:repeat(2,1fr)}
  .countdown span{font-size:4rem}
  .likert{grid-template-columns:1fr}
  .likert button{grid-template-columns:30px 1fr;text-align:left;align-items:center}
  .bar2{grid-template-columns:80px 1fr 80px;font-size:.75rem}
  .bar1{grid-template-columns:100px 1fr 40px}
  .stagewrap{padding-inline:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
